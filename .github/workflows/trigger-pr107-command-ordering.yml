name: trigger-pr107-command-ordering

on:
  pull_request:
    branches:
      - fix/pr107-command-ordering

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostic/pr119-apply-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/pr107-command-ordering
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3
      - name: Execute reviewed guarded apply script
        run: python3 .github/scripts/apply_pr107_command_ordering.py

      - name: Remove trigger helper
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin fix/pr107-command-ordering
          rm .github/workflows/trigger-pr107-command-ordering.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/trigger-pr107-command-ordering.yml
          git commit -m 'ci: remove PR107 command-ordering trigger'
          git push origin HEAD:fix/pr107-command-ordering
