# SyndridCLI production release workflow.
#
# v0.1 intentionally publishes GitHub Release artifacts only. External package
# registries, documentation deploys, package-manager submissions, DotSlash
# publication, and moving release refs remain disabled until Syndrid-owned
# identities and authorization are explicitly available.

name: rust-release

on:
  push:
    tags:
      - "rust-v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag version and main provenance
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
            || { echo "Not a tag ref"; exit 1; }

          [[ "${GITHUB_REF_NAME}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]] \
            || { echo "Tag '${GITHUB_REF_NAME}' does not match the release format"; exit 1; }

          tag_ver="${GITHUB_REF_NAME#rust-v}"
          cargo_ver="$(grep -m1 '^version' codex-rs/Cargo.toml \
            | sed -E 's/version *= *"([^"]+)".*/\1/')"
          [[ "$tag_ver" == "$cargo_ver" ]] \
            || { echo "Tag version $tag_ver does not match Cargo.toml $cargo_ver"; exit 1; }

          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main" \
            || { echo "Tagged commit is not contained in origin/main"; exit 1; }

          echo "Validated release ${tag_ver} from main history"

  build:
    needs: tag-check
    name: Build Linux package - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard hosted runners replace the unavailable upstream self-hosted labels.
          - target: x86_64-unknown-linux-musl
            runs_on: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Use hermetic Cargo home
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "$cargo_home/bin"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
          : > "$cargo_home/config.toml"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bwrap and export digest
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --bin bwrap
          bwrap_path="target/${target}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Build Syndrid release binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release \
            --bin syndrid \
            --bin codex-code-mode-host

      - name: Cosign Linux release binaries
        uses: ./.github/actions/linux-code-sign
        with:
          target: ${{ matrix.target }}
          artifacts-dir: ${{ github.workspace }}/codex-rs/target/${{ matrix.target }}/release
          binaries: "syndrid codex-code-mode-host bwrap"

      - name: Build canonical Syndrid package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          mkdir -p "dist/$target"
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$target" \
            --bundle syndrid \
            --entrypoint-dir "target/$target/release" \
            --archive-dir "dist/$target"

      - name: Upload Linux Syndrid package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: |
            codex-rs/dist/${{ matrix.target }}/syndrid-package-${{ matrix.target }}.tar.gz
            codex-rs/dist/${{ matrix.target }}/syndrid-package-${{ matrix.target }}.tar.zst
          if-no-files-found: error

  build-macos:
    needs: tag-check
    name: Build unsigned macOS binaries - ${{ matrix.target }}
    runs-on: macos-15-xlarge
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Syndrid release binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release \
            --bin syndrid \
            --bin codex-code-mode-host

      - name: Stage unsigned macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          dest="unsigned-dist/$target"
          mkdir -p "$dest"
          cp "target/$target/release/syndrid" "$dest/syndrid"
          cp "target/$target/release/codex-code-mode-host" "$dest/codex-code-mode-host"

      - name: Upload unsigned macOS binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-unsigned
          path: codex-rs/unsigned-dist/${{ matrix.target }}/*
          if-no-files-found: error

  sign-macos-binaries:
    needs: build-macos
    name: Sign macOS binaries - ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: codesigning
      deployment: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download unsigned macOS binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.target }}-unsigned
          path: ${{ runner.temp }}/unsigned-macos

      - name: Set up AKV PKCS11 macOS signing
        uses: ./.github/actions/setup-akv-pkcs11-codesigning
        with:
          rcodesign-blob-uri: ${{ secrets.AKV_CODESIGN_RCODESIGN_BLOB_URI }}
          rcodesign-sha256: ${{ secrets.AKV_CODESIGN_RCODESIGN_SHA256 }}
          akv-pkcs11-library-blob-uri: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_BLOB_URI }}
          akv-pkcs11-library-sha256: ${{ secrets.AKV_CODESIGN_PKCS11_LIBRARY_SHA256 }}
          azure-client-id: ${{ secrets.AKV_CODESIGN_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AKV_CODESIGN_TENANT }}
          azure-subscription-id: ${{ secrets.AKV_CODESIGN_SUBSCRIPTION }}
          key-vault-name: ${{ secrets.AKV_CODESIGN_KEY_VAULT_NAME }}
          key-name: ${{ secrets.AKV_CODESIGN_KEY_NAME }}
          key-version: ${{ secrets.AKV_CODESIGN_KEY_VERSION || '' }}
          certificate-sha256: ${{ secrets.AKV_CODESIGN_CERTIFICATE_SHA256 || '' }}

      - name: Sign and notarize macOS binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          input_dir="${RUNNER_TEMP}/unsigned-macos"
          output_dir="${GITHUB_WORKSPACE}/signed-macos/${TARGET}"
          report_dir="${GITHUB_WORKSPACE}/macos-signing-verification/${TARGET}"
          mkdir -p "$output_dir" "$report_dir"

          for binary in syndrid codex-code-mode-host; do
            signed_path="$output_dir/$binary"
            cp "$input_dir/$binary" "$signed_path"
            chmod 0755 "$signed_path"
            entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            test -f "$entitlements"
            .github/scripts/macos-signing/sign_macos_code.sh \
              --target "$signed_path" \
              --identity unused \
              --deep false \
              --identifier "$binary" \
              --options runtime \
              --timestamp true \
              --entitlements "$entitlements"
            mkdir -p "$report_dir/$binary"
            rcodesign print-signature-info "$signed_path" >"$report_dir/$binary/signature-info.yaml"
            .github/scripts/macos-signing/notarize_macos_binary_with_rcodesign.sh \
              --binary "$signed_path" \
              --report-dir "$report_dir/$binary"
          done

      - name: Upload signed macOS binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-signed-binaries
          path: signed-macos/${{ matrix.target }}/*
          if-no-files-found: error

  finalize-macos:
    needs: sign-macos-binaries
    name: Package and verify signed macOS Syndrid - ${{ matrix.target }}
    runs-on: macos-15-xlarge
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download signed macOS binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.target }}-signed-binaries
          path: codex-rs/target/${{ matrix.target }}/release

      - name: Verify signed macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          for binary in syndrid codex-code-mode-host; do
            path="target/${{ matrix.target }}/release/$binary"
            chmod 0755 "$path"
            codesign --verify --strict --verbose=2 "$path"
          done

      - name: Build canonical signed Syndrid package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          mkdir -p "dist/$target"
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$target" \
            --bundle syndrid \
            --entrypoint-dir "target/$target/release" \
            --archive-dir "dist/$target"

      - name: Verify canonical signed Syndrid package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          case "$target" in
            aarch64-apple-darwin) expected_arch="arm64" ;;
            x86_64-apple-darwin) expected_arch="x86_64" ;;
            *) exit 1 ;;
          esac

          verify_signed_binary() {
            local path="$1"
            local binary="$2"
            local actual_entitlements expected_entitlements normalized_actual normalized_expected
            chmod 0755 "$path"
            lipo "$path" -verify_arch "$expected_arch"
            codesign --verify --strict --verbose=2 "$path"
            expected_entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            actual_entitlements="$(mktemp)"
            normalized_actual="$(mktemp)"
            normalized_expected="$(mktemp)"
            codesign -d --entitlements :- "$path" >"$actual_entitlements"
            plutil -convert xml1 -o "$normalized_actual" "$actual_entitlements"
            plutil -convert xml1 -o "$normalized_expected" "$expected_entitlements"
            diff -u "$normalized_expected" "$normalized_actual"
            rm -f "$actual_entitlements" "$normalized_actual" "$normalized_expected"
          }

          package_dir="${RUNNER_TEMP}/syndrid-package-$target"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          tar -xzf "dist/$target/syndrid-package-$target.tar.gz" -C "$package_dir"
          verify_signed_binary "${package_dir}/bin/syndrid" "syndrid"
          verify_signed_binary "${package_dir}/bin/codex-code-mode-host" "codex-code-mode-host"

      - name: Upload verified macOS Syndrid package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: |
            codex-rs/dist/${{ matrix.target }}/syndrid-package-${{ matrix.target }}.tar.gz
            codex-rs/dist/${{ matrix.target }}/syndrid-package-${{ matrix.target }}.tar.zst
          if-no-files-found: error

  build-windows:
    needs: tag-check
    uses: ./.github/workflows/rust-release-windows.yml
    secrets: inherit

  release:
    needs:
      - tag-check
      - build
      - finalize-macos
      - build-windows
    if: >-
      ${{
        always() &&
        needs.tag-check.result == 'success' &&
        needs.build.result == 'success' &&
        needs.finalize-macos.result == 'success' &&
        needs.build-windows.result == 'success'
      }}
    name: Publish Syndrid GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.release_name.outputs.name }}
      tag: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate release notes from tag commit
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          notes_path="${RUNNER_TEMP}/release-notes.md"
          git log -1 --format=%B "$commit" >"$notes_path"
          echo >>"$notes_path"
          echo "path=$notes_path" >>"$GITHUB_OUTPUT"

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: raw-targets
          pattern: "{aarch64,x86_64}-{apple-darwin,unknown-linux-musl,pc-windows-msvc}"

      - name: Stage canonical Syndrid target archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r archive; do
            cp "$archive" "dist/$(basename "$archive")"
          done < <(
            find raw-targets -type f \
              \( -name 'syndrid-package-*.tar.gz' -o -name 'syndrid-package-*.tar.zst' \) \
              -print | sort
          )
          ls -la dist

      - name: Define release name
        id: release_name
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#rust-v}"
          echo "name=$version" >>"$GITHUB_OUTPUT"

      - name: Stage Syndrid publication assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/stage_syndrid_release_assets.py --dist dist
          test -f dist/syndrid-package_SHA256SUMS
          find dist -maxdepth 1 -type f -name 'syndrid-package-*.tar.gz' -print | sort
          find dist -maxdepth 1 -type f -name 'syndrid-package-*.tar.zst' -print | sort
          cat dist/syndrid-package_SHA256SUMS

      - name: Extract canonical Syndrid package for smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP}/syndrid-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          tar -xzf dist/syndrid-package-x86_64-unknown-linux-musl.tar.gz \
            -C "$smoke_dir"

      - name: Smoke canonical Syndrid package entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/smoke_syndrid_release_binary.py \
            "${RUNNER_TEMP}/syndrid-smoke/bin/syndrid" \
            --expect-version "${{ steps.release_name.outputs.name }}"

      - name: Audit Syndrid release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check_syndrid_release_contract.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ steps.release_name.outputs.name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: dist/**
          overwrite_files: false
          make_latest: ${{ !contains(steps.release_name.outputs.name, '-') }}
          prerelease: ${{ contains(steps.release_name.outputs.name, '-') }}
