name: tui-clippy-slash-print-one-shot

on:
  push:
    branches: [fix/tui-rust195-clippy]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/tui-rust195-clippy
      - name: Remove verified test-only debug output
        shell: python
        run: |
          from pathlib import Path
          path = Path('codex-rs/tui/src/chatwidget/tests/slash_commands.rs')
          text = path.read_text()
          old = '        println!("\\n--- SYNDRID EFFORT {width}x{height} ---\\n{output}");\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one verified debug println, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1))
      - name: Verify exact source diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --numstat -- codex-rs/tui/src/chatwidget/tests/slash_commands.rs)" = $'0\t1\tcodex-rs/tui/src/chatwidget/tests/slash_commands.rs'
          test "$(git diff --name-only -- codex-rs/tui/src)" = "codex-rs/tui/src/chatwidget/tests/slash_commands.rs"
          ! grep -Fq -- '--- SYNDRID EFFORT' codex-rs/tui/src/chatwidget/tests/slash_commands.rs
      - name: Commit exact cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/tui-clippy-slash-print-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/chatwidget/tests/slash_commands.rs .github/workflows/tui-clippy-slash-print-one-shot.yml
          git diff --cached --check
          git commit -m 'fix(tui): remove slash-command debug output'
          git push origin HEAD:fix/tui-rust195-clippy
