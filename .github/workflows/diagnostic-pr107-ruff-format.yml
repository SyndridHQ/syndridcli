name: diagnostic-pr107-ruff-format

on:
  pull_request:
    branches:
      - release/syndrid-v01-contract-check

permissions:
  contents: write

jobs:
  ruff-format-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostic/pr107-ruff-format-diff'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: diagnostic/pr107-ruff-format-diff
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3
      - name: Apply canonical Ruff formatting and remove diagnostic helper
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format scripts/install
          rm .github/workflows/diagnostic-pr107-ruff-format.yml

          allowed='^(scripts/install/test_syndrid_release_(artifact_collection|checksum_contract|concurrency|gate_ordering|hardening|installer_contract|macos_distribution_contract|package_bundle_enumeration|publication_dependencies|shell_manifest_contract|signed_package_ordering|smoke_contract|smoke_package_binding|tag_provenance|tag_side_effects)\.py|\.github/workflows/diagnostic-pr107-ruff-format\.yml)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected formatter delta:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          changed="$(git diff --name-only | grep '^scripts/install/test_syndrid_release_.*\.py$' || true)"
          if [[ -z "$changed" ]]; then
            echo 'expected Ruff formatting delta was empty' >&2
            exit 1
          fi

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install .github/workflows/diagnostic-pr107-ruff-format.yml
          git commit -m 'style: apply canonical Ruff formatting to release tests'
          git push origin HEAD:diagnostic/pr107-ruff-format-diff
