name: tui-clippy-composition-mechanical-one-shot

on:
  push:
    branches: [fix/tui-rust195-clippy]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/tui-rust195-clippy
      - name: Apply exact composition Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('codex-rs/tui/src/syndrid_composition.rs')
          text = path.read_text()
          replacements = [
              (
                  '''            .active()\n            .map(Clone::clone)''',
                  '''            .active()\n            .cloned()''',
                  'map_clone',
              ),
              (
                  '''            provider: TuiProviderAuthority::from_loaded(\n                accounts.clone(),\n                omni_route.clone(),\n                account_error.or(omni_error),\n            ),''',
                  '''            provider: TuiProviderAuthority::from_loaded(\n                accounts,\n                omni_route,\n                account_error.or(omni_error),\n            ),''',
                  'final provider clones',
              ),
              (
                  '''            .filter(|policy| policy.requires_syndrid_runtime())''',
                  '''            .filter(\n                codex_app_server_client::legacy_core::ResolvedOrchestrationPolicy::requires_syndrid_runtime,\n            )''',
                  'redundant policy closure',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/tui-clippy-composition-mechanical-one-shot.yml')
          workflow.unlink()
      - name: Format and verify
        run: |
          rustfmt codex-rs/tui/src/syndrid_composition.rs
          git diff --check
          git diff -- codex-rs/tui/src/syndrid_composition.rs
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/syndrid_composition.rs .github/workflows/tui-clippy-composition-mechanical-one-shot.yml
          git diff --cached --check
          git commit -m 'fix(tui): clear composition mechanical Clippy findings'
          git push origin HEAD:fix/tui-rust195-clippy
