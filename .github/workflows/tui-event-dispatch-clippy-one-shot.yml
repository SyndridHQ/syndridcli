name: tui-event-dispatch-clippy-one-shot

on:
  push:
    branches: [fix/tui-rust195-clippy]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/tui-rust195-clippy
      - name: Apply exact TUI Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          event_path = Path('codex-rs/tui/src/app/event_dispatch.rs')
          event_text = event_path.read_text()

          old_restore = '''if save && let Some(store) = self.orchestration_profile_store.as_ref() {
                            if let Err(restore_error) = store.save(previous.clone()) {
                                message = format!(
                                    "{message}; previous orchestration default restoration failed: {restore_error}"
                                );
                            }
                        }'''
          new_restore = '''if save
                            && let Some(store) = self.orchestration_profile_store.as_ref()
                            && let Err(restore_error) = store.save(previous.clone())
                        {
                            message = format!(
                                "{message}; previous orchestration default restoration failed: {restore_error}"
                            );
                        }'''
          restore_count = event_text.count(old_restore)
          if restore_count != 2:
              raise SystemExit(f'expected exactly 2 restoration blocks, found {restore_count}')
          event_text = event_text.replace(old_restore, new_restore)

          old_event_member = '''crate::legacy_core::PoolMemberId::new("member").unwrap(),'''
          new_event_member = '''match crate::legacy_core::PoolMemberId::new("member") {
                                Ok(member_id) => member_id,
                                Err(_) => unreachable!("static pool member ID is valid"),
                            },'''
          event_member_count = event_text.count(old_event_member)
          if event_member_count != 1:
              raise SystemExit(f'expected exactly 1 event static member unwrap, found {event_member_count}')
          event_text = event_text.replace(old_event_member, new_event_member)
          event_path.write_text(event_text)

          pool_path = Path('codex-rs/tui/src/pool_setup.rs')
          pool_text = pool_path.read_text()
          old_member = 'PoolMemberId::new("member").unwrap()'
          new_member = '''match PoolMemberId::new("member") {
                        Ok(member_id) => member_id,
                        Err(_) => unreachable!("static pool member ID is valid"),
                    }'''
          member_count = pool_text.count(old_member)
          if member_count != 2:
              raise SystemExit(f'expected exactly 2 pool static member unwraps, found {member_count}')
          pool_text = pool_text.replace(old_member, new_member)

          old_pending = 'PoolMemberId::new("pending").unwrap()'
          new_pending = '''match PoolMemberId::new("pending") {
                    Ok(member_id) => member_id,
                    Err(_) => unreachable!("static pending member ID is valid"),
                }'''
          pending_count = pool_text.count(old_pending)
          if pending_count != 2:
              raise SystemExit(f'expected exactly 2 static pending unwraps, found {pending_count}')
          pool_text = pool_text.replace(old_pending, new_pending)
          pool_path.write_text(pool_text)

          Path('.github/workflows/tui-event-dispatch-clippy-one-shot.yml').unlink()
      - name: Format and verify exact scope
        run: |
          rustfmt codex-rs/tui/src/app/event_dispatch.rs codex-rs/tui/src/pool_setup.rs
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/tui-event-dispatch-clippy-one-shot.yml\ncodex-rs/tui/src/app/event_dispatch.rs\ncodex-rs/tui/src/pool_setup.rs'
          git diff -- codex-rs/tui/src/app/event_dispatch.rs codex-rs/tui/src/pool_setup.rs
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/app/event_dispatch.rs codex-rs/tui/src/pool_setup.rs .github/workflows/tui-event-dispatch-clippy-one-shot.yml
          git diff --cached --check
          git commit -m 'fix(tui): clear static-ID and restoration Clippy findings'
          git push origin HEAD:fix/tui-rust195-clippy
