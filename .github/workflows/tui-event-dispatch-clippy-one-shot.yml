name: tui-event-dispatch-clippy-one-shot

on:
  push:
    branches: [fix/tui-rust195-clippy]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/tui-rust195-clippy
      - name: Apply exact event-dispatch Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('codex-rs/tui/src/app/event_dispatch.rs')
          text = path.read_text()
          old = '''if save && let Some(store) = self.orchestration_profile_store.as_ref() {
                            if let Err(restore_error) = store.save(previous.clone()) {
                                message = format!(
                                    "{message}; previous orchestration default restoration failed: {restore_error}"
                                );
                            }
                        }'''
          new = '''if save
                            && let Some(store) = self.orchestration_profile_store.as_ref()
                            && let Err(restore_error) = store.save(previous.clone())
                        {
                            message = format!(
                                "{message}; previous orchestration default restoration failed: {restore_error}"
                            );
                        }'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 restoration blocks, found {count}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/tui-event-dispatch-clippy-one-shot.yml').unlink()
      - name: Format and verify exact scope
        run: |
          rustfmt codex-rs/tui/src/app/event_dispatch.rs
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/tui-event-dispatch-clippy-one-shot.yml\ncodex-rs/tui/src/app/event_dispatch.rs'
          git diff -- codex-rs/tui/src/app/event_dispatch.rs
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/app/event_dispatch.rs .github/workflows/tui-event-dispatch-clippy-one-shot.yml
          git diff --cached --check
          git commit -m 'fix(tui): collapse restoration error paths'
          git push origin HEAD:fix/tui-rust195-clippy
