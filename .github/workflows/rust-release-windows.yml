name: rust-release-windows

on:
  workflow_call:

env:
  WINDOWS_RUNTIME_BINARIES: "syndrid codex-code-mode-host codex-windows-sandbox-setup codex-command-runner"

jobs:
  build-windows-binaries:
    name: Build unsigned Windows Syndrid runtime - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs_on:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-x64
          - target: aarch64-pc-windows-msvc
            runs_on:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure LLVM linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Build Syndrid Windows runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi

          build_args=()
          for binary in ${WINDOWS_RUNTIME_BINARIES}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target "$target" --release --timings "${build_args[@]}"

      - name: Stage unsigned Syndrid runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$CARGO_TARGET_DIR/${{ matrix.target }}/release"
          output_dir="$release_dir/staged-syndrid"
          mkdir -p "$output_dir"
          for binary in ${WINDOWS_RUNTIME_BINARIES}; do
            test -f "$release_dir/${binary}.exe"
            cp "$release_dir/${binary}.exe" "$output_dir/${binary}.exe"
          done

      - name: Upload unsigned Syndrid runtime binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-syndrid-binaries-${{ matrix.target }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/staged-syndrid/*.exe
          if-no-files-found: error

  build-windows:
    needs: build-windows-binaries
    name: Sign and package Windows Syndrid - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    environment:
      name: azure-artifact-signing
      deployment: false
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs_on:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-x64
          - target: aarch64-pc-windows-msvc
            runs_on:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-x64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Download unsigned Syndrid runtime binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-syndrid-binaries-${{ matrix.target }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release

      - name: Verify unsigned runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          for binary in ${WINDOWS_RUNTIME_BINARIES}; do
            test -f "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${binary}.exe"
          done

      - name: Sign Windows binaries with Azure Trusted Signing
        uses: ./.github/actions/windows-code-sign
        with:
          target: ${{ matrix.target }}
          binaries: ${{ env.WINDOWS_RUNTIME_BINARIES }}
          client-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}

      - name: Verify signed Windows runtime inputs
        shell: powershell
        run: |
          foreach ($binary in $env:WINDOWS_RUNTIME_BINARIES.Split(' ')) {
            $path = Join-Path $env:CARGO_TARGET_DIR "${{ matrix.target }}\release\$binary.exe"
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $path: $($signature.Status) $($signature.StatusMessage)"
            }
          }

      - name: Build canonical signed Syndrid package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          mkdir -p "dist/$target"
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh"             --target "$target"             --bundle syndrid             --entrypoint-dir "$CARGO_TARGET_DIR/$target/release"             --archive-dir "dist/$target"

      - name: Verify signed Syndrid package contents
        shell: powershell
        run: |
          $target = "${{ matrix.target }}"
          $packageDir = Join-Path $env:RUNNER_TEMP "syndrid-package-$target"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $packageDir
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          tar -xzf "dist/$target/syndrid-package-$target.tar.gz" -C $packageDir
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract signed Syndrid package for $target."
          }

          $signedPaths = @(
            'bin\syndrid.exe',
            'bin\codex-code-mode-host.exe',
            'codex-resources\codex-command-runner.exe',
            'codex-resources\codex-windows-sandbox-setup.exe'
          )
          foreach ($relativePath in $signedPaths) {
            $path = Join-Path $packageDir $relativePath
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Signed Syndrid package is missing $relativePath."
            }
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature in package for $relativePath: $($signature.Status) $($signature.StatusMessage)"
            }
          }

      - name: Upload signed Windows Syndrid package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: |
            codex-rs/dist/${{ matrix.target }}/syndrid-package-${{ matrix.target }}.tar.gz
            codex-rs/dist/${{ matrix.target }}/syndrid-package-${{ matrix.target }}.tar.zst
          if-no-files-found: error
