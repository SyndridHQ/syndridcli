name: PR74 app-server Windows diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  app-server-windows:
    if: github.head_ref == 'diagnostic/pr74-app-server-shard11-sol' || github.ref_name == 'diagnostic/pr74-app-server-shard11-sol'
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-pr74-app-server-diagnostic

      - name: Run app-server tests with full output
        shell: bash
        run: |
          set -euo pipefail
          bazel_test_args=(
            test
            --skip_incompatible_explicit_targets
            --test_output=all
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_pr74_app_server_diagnostic=true
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-cross-compile \
            --remote-download-toplevel \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            //codex-rs/app-server:app-server-all-test

      - name: Upload app-server Bazel test logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr74-app-server-windows-testlogs
          path: |
            bazel-testlogs/codex-rs/app-server/app-server-all-test
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: warn
