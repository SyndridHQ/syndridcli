name: rust-release-prepare

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Syndrid v0.1 does not inherit the upstream model-refresh/pull-request
    # publication authority. Keep this workflow inert until a Syndrid-owned
    # refresh source, credentials, reviewers, and publication policy are
    # explicitly configured.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Upstream release preparation disabled
        run: echo "Syndrid release preparation automation is intentionally disabled."
