name: apply-tui-final-dead-code-residuals

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [fix/tui-rust195-clippy]
    paths: [.github/tui-final-dead-code-residuals.trigger]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/tui-final-dead-code-residuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact reviewed dead-code expectations
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('codex-rs/tui/src/session_dashboard.rs')
          text = dashboard.read_text()
          needle = '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub(crate) enum DashboardConfidence {\n'''
          replacement = '''#[expect(\n    dead_code,\n    reason = "forecast confidence is reserved for observed estimates; current projections intentionally leave it unavailable"\n)]\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub(crate) enum DashboardConfidence {\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'dashboard confidence guard expected one match, found {text.count(needle)}')
          dashboard.write_text(text.replace(needle, replacement, 1))

          composition = Path('codex-rs/tui/src/syndrid_composition.rs')
          text = composition.read_text()
          provider_needle = '''    pub(crate) fn provider_setup_snapshot(&self) -> &ProviderSetupSnapshot {\n'''
          provider_replacement = '''    #[expect(\n        dead_code,\n        reason = "the raw provider setup snapshot is retained as a trusted inspection boundary while production uses the cooldown-adjusted projection"\n    )]\n    pub(crate) fn provider_setup_snapshot(&self) -> &ProviderSetupSnapshot {\n'''
          runtime_needle = '''    /// Validates a candidate orchestration runtime without publishing it or invoking providers.\n    pub(crate) fn validate_runtime_for_selection(\n'''
          runtime_replacement = '''    /// Validates a candidate orchestration runtime without publishing it or invoking providers.\n    #[expect(\n        dead_code,\n        reason = "candidate runtime validation is retained as a non-publishing trusted authority seam for selection admission"\n    )]\n    pub(crate) fn validate_runtime_for_selection(\n'''
          if text.count(provider_needle) != 1:
              raise SystemExit(f'provider snapshot guard expected one match, found {text.count(provider_needle)}')
          if text.count(runtime_needle) != 1:
              raise SystemExit(f'runtime validation guard expected one match, found {text.count(runtime_needle)}')
          text = text.replace(provider_needle, provider_replacement, 1)
          text = text.replace(runtime_needle, runtime_replacement, 1)
          composition.write_text(text)
      - name: Verify exact source-only delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tui-final-dead-code-residuals.trigger
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = '.github/tui-final-dead-code-residuals.trigger'
          test "${changed[1]}" = 'codex-rs/tui/src/session_dashboard.rs'
          test "${changed[2]}" = 'codex-rs/tui/src/syndrid_composition.rs'
      - name: Commit guarded source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(tui): document intentional dead-code boundaries'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
