name: pr83-mechanical-patch

on:
  push:
    branches: [diagnostic/pr83-mechanical-patch]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: diagnostic/pr83-mechanical-patch
      - name: Apply exact mechanical fixes
        shell: python
        run: |
          from pathlib import Path

          def remove_standalone_println(path_str: str, expected: int) -> None:
              path = Path(path_str)
              text = path.read_text()
              out = []
              i = 0
              removed = 0
              needle = 'println!('
              while True:
                  idx = text.find(needle, i)
                  if idx < 0:
                      out.append(text[i:])
                      break
                  line_start = text.rfind('\n', i, idx) + 1
                  if text[line_start:idx].strip():
                      raise SystemExit(f'non-standalone println in {path_str}')
                  out.append(text[i:line_start])
                  depth = 0
                  j = idx + len('println!')
                  in_string = False
                  escaped = False
                  while j < len(text):
                      ch = text[j]
                      if in_string:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == '"':
                              in_string = False
                      else:
                          if ch == '"':
                              in_string = True
                          elif ch == '(':
                              depth += 1
                          elif ch == ')':
                              depth -= 1
                              if depth == 0:
                                  j += 1
                                  while j < len(text) and text[j].isspace() and text[j] != '\n':
                                      j += 1
                                  if j >= len(text) or text[j] != ';':
                                      raise SystemExit(f'println without semicolon in {path_str}')
                                  j += 1
                                  if j < len(text) and text[j] == '\n':
                                      j += 1
                                  break
                      j += 1
                  else:
                      raise SystemExit(f'unterminated println in {path_str}')
                  removed += 1
                  i = j
              if removed != expected:
                  raise SystemExit(f'{path_str}: expected {expected} printlns, found {removed}')
              path.write_text(''.join(out))

          path = Path('codex-rs/tui/src/syndrid_composition_tests.rs')
          text = path.read_text()
          old = '''connection_id: pool_id
                                  .is_none()
                                  .then(|| "account-a1".to_string())
                                  .unwrap_or_default(),'''
          if old not in text:
              old = '''connection_id: pool_id
                          .is_none()
                          .then(|| "account-a1".to_string())
                          .unwrap_or_default(),'''
          new = '''connection_id: if pool_id.is_none() {
                          "account-a1".to_string()
                      } else {
                          String::new()
                      },'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one composition bool::then pattern')
          path.write_text(text.replace(old, new, 1))

          remove_standalone_println('codex-rs/tui/src/chatwidget/tests/popups_and_settings.rs', 1)
          remove_standalone_println('codex-rs/tui/src/chatwidget/tests/slash_commands.rs', 1)
          remove_standalone_println('codex-rs/tui/src/chatwidget/tests/status_and_layout.rs', 3)
      - name: Format and verify
        run: |
          rustfmt codex-rs/tui/src/syndrid_composition_tests.rs \
            codex-rs/tui/src/chatwidget/tests/popups_and_settings.rs \
            codex-rs/tui/src/chatwidget/tests/slash_commands.rs \
            codex-rs/tui/src/chatwidget/tests/status_and_layout.rs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/syndrid_composition_tests.rs \
            codex-rs/tui/src/chatwidget/tests/popups_and_settings.rs \
            codex-rs/tui/src/chatwidget/tests/slash_commands.rs \
            codex-rs/tui/src/chatwidget/tests/status_and_layout.rs
          git diff --cached --check
          git commit -m 'fix(tui): clear mechanical test Clippy findings'
          git push origin HEAD:diagnostic/pr83-mechanical-patch