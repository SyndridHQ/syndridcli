name: tui-clippy-mechanical-fix

on:
  push:
    branches:
      - fix/tui-rust195-clippy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/tui-rust195-clippy
      - name: Apply mechanical lint fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          path = Path('codex-rs/tui/src/syndrid_composition_tests.rs')
          text = path.read_text()
          old = '''connection_id: pool_id
                        .is_none()
                        .then(|| "account-a1".to_string())
                        .unwrap_or_default(),'''
          new = '''connection_id: if pool_id.is_none() {
                        "account-a1".to_string()
                    } else {
                        String::new()
                    },'''
          if old not in text:
              raise SystemExit('expected syndrid_composition_tests pattern not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          changed.append(str(path))

          for name in [
              'codex-rs/tui/src/chatwidget/tests/popups_and_settings.rs',
              'codex-rs/tui/src/chatwidget/tests/slash_commands.rs',
              'codex-rs/tui/src/chatwidget/tests/status_and_layout.rs',
          ]:
              path = Path(name)
              text = path.read_text()
              before = text
              text = re.sub(r'\n\s*println!\((?:[^()]|\([^()]*\))*\);', '', text, flags=re.S)
              if text != before:
                  path.write_text(text)
                  changed.append(name)

          workflow = Path('.github/workflows/tui-clippy-mechanical-fix.yml')
          workflow.unlink()
          print('changed:', *changed, sep='\n- ')
      - name: Format affected Rust files
        run: |
          rustfmt codex-rs/tui/src/syndrid_composition_tests.rs \
            codex-rs/tui/src/chatwidget/tests/popups_and_settings.rs \
            codex-rs/tui/src/chatwidget/tests/slash_commands.rs \
            codex-rs/tui/src/chatwidget/tests/status_and_layout.rs
      - name: Commit cleanup and self-delete workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/syndrid_composition_tests.rs \
            codex-rs/tui/src/chatwidget/tests/popups_and_settings.rs \
            codex-rs/tui/src/chatwidget/tests/slash_commands.rs \
            codex-rs/tui/src/chatwidget/tests/status_and_layout.rs \
            .github/workflows/tui-clippy-mechanical-fix.yml
          git diff --cached --check
          git commit -m 'fix(tui): clear mechanical test Clippy findings'
          git push origin HEAD:fix/tui-rust195-clippy
