name: tui-status-closure-one-shot

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 83 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/tui-rust195-clippy
      - name: Apply exact status closure cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path('codex-rs/tui/src/status/card.rs')
          text = path.read_text()
          old = '.flat_map(|line| line.into_iter())'
          new = '.flat_map(IntoIterator::into_iter)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one status closure, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/tui-status-closure-one-shot.yml').unlink()
      - name: Format and verify
        run: |
          rustfmt codex-rs/tui/src/status/card.rs
          git diff --check
          git diff -- codex-rs/tui/src/status/card.rs .github/workflows/tui-status-closure-one-shot.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/status/card.rs .github/workflows/tui-status-closure-one-shot.yml
          git diff --cached --check
          git commit -m 'fix(tui): simplify status context iterator'
          git push origin HEAD:fix/tui-rust195-clippy
