name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-reviewed-tui-dead-helpers:
    name: Apply reviewed TUI dead helpers
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/tui-rust195-clippy' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Apply exact reviewed deletions and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('codex-rs/tui/src/bottom_pane/chat_composer.rs'): [
                  '''    #[cfg(test)]\n    pub(crate) fn syndrid_status_snapshot(&self) -> Option<&SyndridStatusSnapshot> {\n        self.footer.syndrid_status.as_ref()\n    }\n\n''',
              ],
              Path('codex-rs/tui/src/syndrid_screen.rs'): [
                  '''    fn value(value: Option<impl ToString>) -> String {\n        value.map_or_else(|| "—".to_string(), |value| value.to_string())\n    }\n\n''',
                  '''    fn metric(label: &'static str, value: String) -> Line<'static> {\n        Line::from(vec![\n            Span::styled(\n                format!("{label:<18}"),\n                Style::default().fg(syndrid_visuals::SECONDARY_TEXT),\n            ),\n            Span::styled(value, Style::default().fg(syndrid_visuals::PRIMARY_TEXT)),\n        ])\n    }\n\n''',
                  '''    fn context(&self) -> String {\n        match (self.live.context_used, self.live.context_window) {\n            (Some(used), Some(window)) => format!("{used} / {window}"),\n            _ => "—".to_string(),\n        }\n    }\n\n''',
              ],
          }
          for path, snippets in replacements.items():
              text = path.read_text()
              for snippet in snippets:
                  count = text.count(snippet)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one reviewed snippet, found {count}')
                  text = text.replace(snippet, '', 1)
              path.write_text(text)
          PY
          git checkout HEAD^ -- .github/workflows/blocking-ci.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/blocking-ci.yml\ncodex-rs/tui/src/bottom_pane/chat_composer.rs\ncodex-rs/tui/src/syndrid_screen.rs'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/blocking-ci.yml codex-rs/tui/src/bottom_pane/chat_composer.rs codex-rs/tui/src/syndrid_screen.rs
          git commit -m "fix(tui): remove reviewed dead helpers"
          git push origin HEAD:fix/tui-rust195-clippy

  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
