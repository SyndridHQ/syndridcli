name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

  tui-safe-residuals-apply:
    name: Apply reviewed TUI residual cleanup
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'fix/tui-rust195-clippy' && github.event.pull_request.head.ref == 'apply/tui-safe-residuals' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: apply/tui-safe-residuals
          persist-credentials: true

      - name: Apply exact reviewed rewrites
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded pattern, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "codex-rs/tui/src/bottom_pane/chat_composer.rs",
              """    #[cfg(test)]
          pub(crate) fn syndrid_status_snapshot(&self) -> Option<&SyndridStatusSnapshot> {
              self.footer.syndrid_status.as_ref()
          }

          """,
              "",
          )

          replace_once(
              "codex-rs/tui/src/session_dashboard.rs",
              """#[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum DashboardConfidence {
          """,
              """// Forecast confidence is intentionally unavailable until the TUI has an
          // authoritative forecast source; keep the presentation contract without fabricating data.
          #[allow(dead_code)]
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum DashboardConfidence {
          """,
          )

          replace_once(
              "codex-rs/tui/src/syndrid_composition.rs",
              """    pub(crate) fn new_with_authorities(
          """,
              """    // This is the explicit authority-injection boundary. Bundling these independent
              // authorities into a synthetic parameter object would obscure ownership without
              // reducing the boundary's actual complexity.
              #[allow(clippy::too_many_arguments)]
              pub(crate) fn new_with_authorities(
          """,
          )
          replace_once(
              "codex-rs/tui/src/syndrid_composition.rs",
              """    pub(crate) fn provider_setup_snapshot(&self) -> &ProviderSetupSnapshot {
              &self.setup_snapshot
          }

          """,
              "",
          )
          replace_once(
              "codex-rs/tui/src/syndrid_composition.rs",
              """    /// Validates a candidate orchestration runtime without publishing it or invoking providers.
              pub(crate) fn validate_runtime_for_selection(
                  &self,
                  strategy: OrchestrationMode,
                  preset: ExecutionModeSelection,
              ) -> Result<(), String> {
                  let candidate_state = (*self.policy_state).clone();
                  candidate_state
                      .select_strategy(strategy)
                      .map_err(|error| error.to_string())?;
                  candidate_state
                      .select_mode(
                          preset,
                          codex_app_server_client::legacy_core::SessionPolicySource::SessionOverride,
                      )
                      .map_err(|error| error.to_string())?;
                  let policy = candidate_state
                      .resolved_orchestration_policy()
                      .map_err(|error| error.to_string())?;
                  if !policy.requires_syndrid_runtime() {
                      return Ok(());
                  }
                  let snapshot = self
                      .source
                      .snapshot_with_policy_state(
                          TrustedCompositionSnapshotRequest {
                              session_id: self.source.session_id().to_owned(),
                              workspace_root: self.workspace_root.clone(),
                          },
                          &candidate_state,
                      )
                      .map_err(|error| error.to_string())?;
                  assemble_trusted_production_runtime(&snapshot, candidate_state)
                      .map(|_| ())
                      .map_err(|error| error.to_string())
              }

          """,
              "",
          )

          replace_once(
              "codex-rs/tui/src/syndrid_screen.rs",
              """    fn value(value: Option<impl ToString>) -> String {
              value.map_or_else(|| "—".to_string(), |value| value.to_string())
          }

              fn metric(label: &'static str, value: String) -> Line<'static> {
                  Line::from(vec![
                      Span::styled(
                          format!("{label:<18}"),
                          Style::default().fg(syndrid_visuals::SECONDARY_TEXT),
                      ),
                      Span::styled(value, Style::default().fg(syndrid_visuals::PRIMARY_TEXT)),
                  ])
              }

          """,
              "",
          )
          replace_once(
              "codex-rs/tui/src/syndrid_screen.rs",
              """    fn context(&self) -> String {
              match (self.live.context_used, self.live.context_window) {
                  (Some(used), Some(window)) => format!("{used} / {window}"),
                  _ => "—".to_string(),
              }
          }

          """,
              "",
          )
          replace_once(
              "codex-rs/tui/src/syndrid_screen.rs",
              "                for column in 0..chunk.len() {\n",
              "                for (column, group) in chunk.iter().enumerate() {\n",
          )
          replace_once(
              "codex-rs/tui/src/syndrid_screen.rs",
              "                    let command = chunk[column].get(row).copied();\n",
              "                    let command = group.get(row).copied();\n",
          )
          replace_once(
              "codex-rs/tui/src/syndrid_screen.rs",
              """                self.selected = commands
                      .iter()
                      .position(|command| command == next)
                      .expect("group command comes from filtered commands");
                  return;
          """,
              """                let Some(position) = commands.iter().position(|command| command == next) else {
                      unreachable!("group command comes from filtered commands");
                  };
                  self.selected = position;
                  return;
          """,
          )

      - name: Verify exact source scope
        run: |
          rustfmt \
            codex-rs/tui/src/bottom_pane/chat_composer.rs \
            codex-rs/tui/src/session_dashboard.rs \
            codex-rs/tui/src/syndrid_composition.rs \
            codex-rs/tui/src/syndrid_screen.rs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/tui/src/bottom_pane/chat_composer.rs \
            codex-rs/tui/src/session_dashboard.rs \
            codex-rs/tui/src/syndrid_composition.rs \
            codex-rs/tui/src/syndrid_screen.rs | sort)"
          test "$actual" = "$expected"

      - name: Commit source change
        run: |
          rm .tmp-tui-safe-residuals
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tui): clear reviewed residual lint debt'
          git push origin HEAD:apply/tui-safe-residuals
