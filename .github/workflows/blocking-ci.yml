name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

  tui-final-dead-code-apply:
    name: Apply reviewed final TUI dead-code expectations
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'fix/tui-rust195-clippy' && github.event.pull_request.head.ref == 'fix/tui-final-dead-code-residuals' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/tui-final-dead-code-residuals
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact reviewed expectations
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('codex-rs/tui/src/session_dashboard.rs')
          text = dashboard.read_text()
          needle = '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub(crate) enum DashboardConfidence {\n'''
          replacement = '''#[expect(\n    dead_code,\n    reason = "forecast confidence is reserved for observed estimates; current projections intentionally leave it unavailable"\n)]\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub(crate) enum DashboardConfidence {\n'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'dashboard confidence guard expected one match, found {count}')
          dashboard.write_text(text.replace(needle, replacement, 1))

          composition = Path('codex-rs/tui/src/syndrid_composition.rs')
          text = composition.read_text()
          provider_needle = '''    pub(crate) fn provider_setup_snapshot(&self) -> &ProviderSetupSnapshot {\n'''
          provider_replacement = '''    #[expect(\n        dead_code,\n        reason = "the raw provider setup snapshot is retained as a trusted inspection boundary while production uses the cooldown-adjusted projection"\n    )]\n    pub(crate) fn provider_setup_snapshot(&self) -> &ProviderSetupSnapshot {\n'''
          runtime_needle = '''    /// Validates a candidate orchestration runtime without publishing it or invoking providers.\n    pub(crate) fn validate_runtime_for_selection(\n'''
          runtime_replacement = '''    /// Validates a candidate orchestration runtime without publishing it or invoking providers.\n    #[expect(\n        dead_code,\n        reason = "candidate runtime validation is retained as a non-publishing trusted authority seam for selection admission"\n    )]\n    pub(crate) fn validate_runtime_for_selection(\n'''
          provider_count = text.count(provider_needle)
          runtime_count = text.count(runtime_needle)
          if provider_count != 1:
              raise SystemExit(f'provider snapshot guard expected one match, found {provider_count}')
          if runtime_count != 1:
              raise SystemExit(f'runtime validation guard expected one match, found {runtime_count}')
          text = text.replace(provider_needle, provider_replacement, 1)
          text = text.replace(runtime_needle, runtime_replacement, 1)
          composition.write_text(text)

      - name: Verify exact source-only delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tui-final-dead-code-residuals.trigger
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = '.github/tui-final-dead-code-residuals.trigger'
          test "${changed[1]}" = 'codex-rs/tui/src/session_dashboard.rs'
          test "${changed[2]}" = 'codex-rs/tui/src/syndrid_composition.rs'

      - name: Commit guarded source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(tui): document intentional dead-code boundaries'
          git push origin HEAD:fix/tui-final-dead-code-residuals
