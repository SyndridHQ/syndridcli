name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

  tui-execution-mode-mechanical-patch:
    name: TUI execution-mode mechanical patch
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 83 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/tui-rust195-clippy
          fetch-depth: 2
      - name: Apply exact reviewed rewrites
        shell: python
        run: |
          from pathlib import Path

          path = Path('codex-rs/tui/src/chatwidget/execution_mode.rs')
          text = path.read_text()
          replacements = [
              (
                  '''let actions = unavailable\n                    .is_none()\n                    .then(|| {\n                        vec![\n                            Box::new(move |tx: &crate::app_event_sender::AppEventSender| {\n                                tx.send(crate::app_event::AppEvent::UpdateOrchestrationStrategy(\n                                    selected,\n                                ));\n                            }) as crate::bottom_pane::SelectionAction,\n                        ]\n                    })\n                    .unwrap_or_default();''',
                  '''let actions = if unavailable.is_none() {\n                    vec![\n                        Box::new(move |tx: &crate::app_event_sender::AppEventSender| {\n                            tx.send(crate::app_event::AppEvent::UpdateOrchestrationStrategy(\n                                selected,\n                            ));\n                        }) as crate::bottom_pane::SelectionAction,\n                    ]\n                } else {\n                    Vec::new()\n                };''',
              ),
              (
                  '''actions: save_available\n                .then(|| {\n                    vec![Box::new(|tx: &crate::app_event_sender::AppEventSender| {\n                        tx.send(crate::app_event::AppEvent::SaveOrchestrationProfile);\n                    })\n                        as crate::bottom_pane::SelectionAction]\n                })\n                .unwrap_or_default(),''',
                  '''actions: if save_available {\n                vec![Box::new(|tx: &crate::app_event_sender::AppEventSender| {\n                    tx.send(crate::app_event::AppEvent::SaveOrchestrationProfile);\n                }) as crate::bottom_pane::SelectionAction]\n            } else {\n                Vec::new()\n            },''',
              ),
              (
                  '''let model_id = (assignment.provider_id == provider_id\n            && assignment.connection_id == connection_id)\n            .then_some(assignment.model_id)\n            .unwrap_or_default();''',
                  '''let model_id = if assignment.provider_id == provider_id\n            && assignment.connection_id == connection_id\n        {\n            assignment.model_id\n        } else {\n            String::new()\n        };''',
              ),
              (
                  '''match state.select_mode(\n            selection.clone(),\n            SessionPolicySource::ExplicitUserSelection,\n        ) {''',
                  '''match state.select_mode(selection, SessionPolicySource::ExplicitUserSelection) {''',
              ),
              (
                  '''(role == selected_role).then_some("· editing").unwrap_or("")''',
                  '''if role == selected_role { "· editing" } else { "" }''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Format and verify
        run: |
          rustfmt codex-rs/tui/src/chatwidget/execution_mode.rs
          git diff --check
      - name: Restore workflow and commit source-only patch
        run: |
          git show HEAD^:.github/workflows/blocking-ci.yml > .github/workflows/blocking-ci.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/chatwidget/execution_mode.rs .github/workflows/blocking-ci.yml
          git diff --cached --check
          git commit -m 'fix(tui): clear mechanical execution-mode Clippy findings'
          git push origin HEAD:fix/tui-rust195-clippy
