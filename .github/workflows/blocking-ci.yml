name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

  tui-map-entry-cleanup:
    name: TUI map-entry cleanup
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/tui-rust195-clippy' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/tui-rust195-clippy
          persist-credentials: true
      - name: Apply exact validation-preserving entry rewrite
        shell: python
        run: |
          from pathlib import Path

          path = Path('codex-rs/tui/src/chatwidget/execution_mode.rs')
          text = path.read_text()
          old = (
              "        if profile.assignments.contains_key(&role) {\n"
              "            let _ = profile.replace_assignment(role, replacement);\n"
              "        } else {\n"
              "            profile.assignments.insert(role, replacement);\n"
              "        }\n"
          )
          new = (
              "        if let std::collections::btree_map::Entry::Vacant(entry) =\n"
              "            profile.assignments.entry(role)\n"
              "        {\n"
              "            entry.insert(replacement);\n"
              "        } else {\n"
              "            let _ = profile.replace_assignment(role, replacement);\n"
              "        }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one guarded map-entry pattern, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Format and verify exact scope
        run: |
          rustfmt codex-rs/tui/src/chatwidget/execution_mode.rs
          git diff --check
          test "$(git diff --name-only -- codex-rs/tui/src | paste -sd ' ' -)" = "codex-rs/tui/src/chatwidget/execution_mode.rs"
      - name: Commit source only
        run: |
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .github/workflows/blocking-ci.yml
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = ".github/workflows/blocking-ci.yml codex-rs/tui/src/chatwidget/execution_mode.rs"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/blocking-ci.yml codex-rs/tui/src/chatwidget/execution_mode.rs
          git commit -m 'fix(tui): preserve validation with map entry API'
          git push origin HEAD:fix/tui-rust195-clippy
