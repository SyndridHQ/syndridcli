name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  tui-mechanical-patch:
    name: Apply guarded TUI mechanical cleanup
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/tui-rust195-clippy
      - name: Apply exact reviewed rewrites
        shell: python
        run: |
          from pathlib import Path

          execution = Path('codex-rs/tui/src/chatwidget/execution_mode.rs')
          text = execution.read_text()
          old = '''        if profile.assignments.contains_key(&role) {
            let _ = profile.replace_assignment(role, replacement);
        } else {
            profile.assignments.insert(role, replacement);
        }
'''
          new = '''        match profile.assignments.entry(role) {
            std::collections::btree_map::Entry::Vacant(entry) => {
                entry.insert(replacement);
            }
            std::collections::btree_map::Entry::Occupied(entry) => {
                drop(entry);
                let _ = profile.replace_assignment(role, replacement);
            }
        }
'''
          if text.count(old) != 1:
              raise SystemExit('execution_mode map-entry guard failed')
          execution.write_text(text.replace(old, new, 1))

          screen = Path('codex-rs/tui/src/syndrid_screen.rs')
          text = screen.read_text()
          old = '''                for column in 0..chunk.len() {
                    if column > 0 {
                        spans.push(Span::raw(" ".repeat(cell_gap)));
                    }
                    let command = chunk[column].get(row).copied();
'''
          new = '''                for (column, group) in chunk.iter().enumerate() {
                    if column > 0 {
                        spans.push(Span::raw(" ".repeat(cell_gap)));
                    }
                    let command = group.get(row).copied();
'''
          if text.count(old) != 1:
              raise SystemExit('syndrid_screen range-loop guard failed')
          text = text.replace(old, new, 1)

          old = '''                self.selected = commands
                    .iter()
                    .position(|command| command == next)
                    .expect("group command comes from filtered commands");
                return;
'''
          new = '''                let Some(position) = commands.iter().position(|command| command == next) else {
                    unreachable!("group command comes from filtered commands");
                };
                self.selected = position;
                return;
'''
          if text.count(old) != 1:
              raise SystemExit('syndrid_screen grouped-command guard failed')
          screen.write_text(text.replace(old, new, 1))
      - name: Format and verify exact scope
        run: |
          rustfmt codex-rs/tui/src/chatwidget/execution_mode.rs codex-rs/tui/src/syndrid_screen.rs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' codex-rs/tui/src/chatwidget/execution_mode.rs codex-rs/tui/src/syndrid_screen.rs | sort)"
          test "$changed" = "$expected"
      - name: Commit source-only cleanup
        run: |
          git checkout HEAD^ -- .github/workflows/blocking-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/blocking-ci.yml codex-rs/tui/src/chatwidget/execution_mode.rs codex-rs/tui/src/syndrid_screen.rs
          git diff --cached --check
          git commit -m 'fix(tui): clear final mechanical Rust 1.95 findings'
          git push origin HEAD:fix/tui-rust195-clippy

  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
