name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  tui-restoration-path-cleanup:
    name: Guarded TUI restoration-path cleanup
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 83 && github.head_ref == 'fix/tui-rust195-clippy' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/tui-rust195-clippy
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor af5125ebddb7efb1dceb10384073f8792592c894 HEAD
          test "$(git diff --name-only af5125ebddb7efb1dceb10384073f8792592c894..HEAD | tr '\n' ' ')" = ".github/workflows/blocking-ci.yml "

      - name: Apply exact restoration-path Clippy rewrites
        shell: python
        run: |
          from pathlib import Path

          path = Path('codex-rs/tui/src/app/event_dispatch.rs')
          text = path.read_text()
          replacements = [
              (
                  '''                        if save && let Some(store) = self.orchestration_profile_store.as_ref() {
                            if let Err(restore_error) = store.save(previous.clone()) {
                                message = format!(
                                    "{message}; previous orchestration default restoration failed: {restore_error}"
                                );
                            }
                        }''',
                  '''                        if save
                            && let Some(store) = self.orchestration_profile_store.as_ref()
                            && let Err(restore_error) = store.save(previous.clone())
                        {
                            message = format!(
                                "{message}; previous orchestration default restoration failed: {restore_error}"
                            );
                        }''',
              ),
              (
                  '''                    if save && let Some(store) = self.orchestration_profile_store.as_ref() {
                        if let Err(restore_error) = store.save(previous.clone()) {
                            message = format!(
                                "{message}; previous orchestration default restoration failed: {restore_error}"
                            );
                        }
                    }''',
                  '''                    if save
                        && let Some(store) = self.orchestration_profile_store.as_ref()
                        && let Err(restore_error) = store.save(previous.clone())
                    {
                        message = format!(
                            "{message}; previous orchestration default restoration failed: {restore_error}"
                        );
                    }''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one restoration block, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Verify and commit source-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 codex-rs/tui/src/app/event_dispatch.rs
          git diff --check
          test "$(git diff --name-only -- codex-rs/tui/src/app/event_dispatch.rs | wc -l)" -eq 1
          git show af5125ebddb7efb1dceb10384073f8792592c894:.github/workflows/blocking-ci.yml > .github/workflows/blocking-ci.yml
          git diff --check
          names="$(git diff --name-only | tr '\n' ' ')"
          case "$names" in
            ".github/workflows/blocking-ci.yml codex-rs/tui/src/app/event_dispatch.rs "|"codex-rs/tui/src/app/event_dispatch.rs .github/workflows/blocking-ci.yml ") ;;
            *) echo "unexpected working-tree paths: $names" >&2; exit 1 ;;
          esac
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/tui/src/app/event_dispatch.rs .github/workflows/blocking-ci.yml
          git diff --cached --check
          test "$(git diff --cached af5125ebddb7efb1dceb10384073f8792592c894 --name-only | tr '\n' ' ')" = "codex-rs/tui/src/app/event_dispatch.rs "
          git commit -m 'fix(tui): collapse orchestration restoration error paths'
          git push origin HEAD:fix/tui-rust195-clippy

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
