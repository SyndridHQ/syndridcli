name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

  tui-screen-residuals-apply:
    name: Apply reviewed TUI screen residuals
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'fix/tui-rust195-clippy' && github.event.pull_request.head.ref == 'apply/tui-safe-residuals' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: apply/tui-safe-residuals
          persist-credentials: true

      - name: Apply exact reviewed screen rewrites
        shell: python
        run: |
          from pathlib import Path
          path = Path("codex-rs/tui/src/syndrid_screen.rs")
          text = path.read_text()

          replacements = [
              (
                  "                for column in 0..chunk.len() {\n",
                  "                for (column, group) in chunk.iter().enumerate() {\n",
              ),
              (
                  "                    let command = chunk[column].get(row).copied();\n",
                  "                    let command = group.get(row).copied();\n",
              ),
              (
                  "                self.selected = commands\n                    .iter()\n                    .position(|command| command == next)\n                    .expect(\"group command comes from filtered commands\");\n                return;\n",
                  "                let Some(position) = commands.iter().position(|command| command == next) else {\n                    unreachable!(\"group command comes from filtered commands\");\n                };\n                self.selected = position;\n                return;\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one guarded screen pattern, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify and commit source change
        run: |
          rustfmt codex-rs/tui/src/syndrid_screen.rs
          rm .tmp-tui-safe-residuals
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' codex-rs/tui/src/syndrid_screen.rs .tmp-tui-safe-residuals | sort)"
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tui): clear reviewed screen lint residuals'
          git push origin HEAD:apply/tui-safe-residuals
